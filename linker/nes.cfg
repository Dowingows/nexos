
MEMORY {
    HEADER: start = $0000, size = $0010, file = %O, fill = yes;

    ZP:     start = $0002, size = $00FE, type = rw;
    RAM:    start = $0200, size = $0300, type = rw;
    HEAP:   start = $0520, size = $0020, type = rw, define = yes;
    EXEC:   start = $0540, size = $00C0, type = rw;
    CSTACK: start = $0600, size = $0200, type = rw;

    PRG:    start = $8000, size = $7F00, file = %O, fill = yes;
    APIROM: start = $FF00, size = $00FA, file = %O, fill = yes;
    VECTOR: start = $FFFA, size = $0006, file = %O, fill = yes;
    CHR:    start = $0000, size = $2000, file = %O, fill = yes;
}

SEGMENTS {
    HEADER:   load = HEADER, type = ro;

    ZEROPAGE: load = ZP,     type = zp, define = yes;
    CODE:     load = PRG,    type = ro;
    RODATA:   load = PRG,    type = ro;
    API:      load = APIROM, type = ro;

    DATA:     load = PRG, run = RAM, type = rw, define = yes;
    BSS:      load = RAM, type = bss, define = yes;

    VECTORS:  load = VECTOR, type = ro;
    CHARS:    load = CHR,    type = ro;
}

SYMBOLS {
    __CSTACK_START__: type = weak, value = $0800;
    __CSTACK_SIZE__:  type = weak, value = $0200;
    ___HEAP_START__: type = weak, value = $0520;
    ___HEAP_SIZE__:  type = weak, value = $0020;
}
