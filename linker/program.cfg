MEMORY {
    # Os seis primeiros bytes pertencem às variáveis de boot do kernel.
    # O runtime cc65 do programa começa onde começa o runtime do kernel.
    ZP:      start = $0008, size = $001A, type = rw;
    PROGRAM: start = $0540, size = $00C0, file = %O, fill = no;
}

SEGMENTS {
    ZEROPAGE: load = ZP, type = zp, define = yes;
    CODE:   load = PROGRAM, type = ro;
    RODATA: load = PROGRAM, type = ro;
    DATA:   load = PROGRAM, run = PROGRAM, type = rw, define = yes;
    BSS:    load = PROGRAM, type = bss, define = yes;
}
